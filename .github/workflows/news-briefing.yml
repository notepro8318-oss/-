name: News Briefing

on:
  schedule:
    # 목표: 매일 06:00 KST(=21:00 UTC) 무렵 도착.
    # GitHub 스케줄은 정시에 실행되지 않고 수 시간 늦어지거나 건너뛰어지는 일이 잦다(이 저장소는 21~23시 UTC 슬롯이
    # 2~3시간 늦은 적이 많음). 그래서 06:00 KST보다 일찍 시작하는 슬롯 + 백업 슬롯을 두고, 먼저 도착한 실행이
    # 발송하면 나머지는 news_briefing.py의 job_guard 검사로 건너뛴다. 정각(:00/:30)은 부하가 몰려 피한다.
    - cron: "23 20 * * *"   # 05:23 KST (지연되면 06:00 전후에 도착)
    - cron: "47 21 * * *"   # 06:47 KST (백업)
    - cron: "13 23 * * *"   # 08:13 KST (백업)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램으로 보내지 않고 로그에만 출력"
        type: boolean
        default: false

permissions:
  contents: write   # 발송 완료 기록(job_state/news_briefing.json) 저장용

concurrency:
  group: news-briefing
  cancel-in-progress: false

jobs:
  news-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r topdown-strategy/quant_system/requirements.txt

      - name: Build and send the news briefing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          # 마지막 cron 슬롯이면 AI 요약에 실패해도 제목만이라도 발송한다(앞 슬롯은 실패 시 다음 슬롯에 재시도를 맡김).
          FINAL_SLOT: ${{ github.event.schedule == '13 23 * * *' && '1' || '' }}
        working-directory: topdown-strategy/quant_system
        run: python news_briefing.py
