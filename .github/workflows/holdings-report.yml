name: Holdings Report

on:
  schedule:
    # 미국 정규장(4:00pm ET) 마감 후 일봉이 확정된 뒤 거래일당 1회.
    # GitHub 스케줄은 수 시간 늦어지거나 건너뛰어지므로 서로 다른 시각의 슬롯 3개를 두고, 먼저 도착한 실행이
    # 발송하면 나머지는 holdings_report.py의 job_guard 검사(마지막 마감 거래일 기준)로 건너뛴다.
    # 표준시(EST, 마감 21:00 UTC)에는 첫 슬롯이 마감 전이라 스크립트가 스스로 보류한다.
    - cron: "47 20 * * 1-5"
    - cron: "17 22 * * 1-5"
    - cron: "47 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # 발송 완료 기록(job_state/holdings_report.json) 저장용

concurrency:
  group: holdings-report
  cancel-in-progress: false

jobs:
  holdings-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r topdown-strategy/quant_system/requirements.txt

      - name: Send holdings report to Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행은 휴장일/장중에도 가장 최근 종가 기준으로 바로 발송해 테스트할 수 있게 한다.
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        working-directory: topdown-strategy/quant_system
        run: python holdings_report.py
